global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: stremio_albanian_subs_addon
    static_configs:
      - targets:
          - stremio_albanian_subs_addon:8000

  - job_name: "blackbox_tcp"
    metrics_path: /probe
    params:
      module: [ tcp_connect ]
    static_configs:
      - targets:
          - "stremio_albanian_subs_addon:8000"
          - "p2p_video_chat_backend:80"
          - "searxng:8080"
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
