groups:
  - name: UpTime
    rules:
      - alert: UpTime
        expr: probe_success{job="blackbox_tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is DOWN"
          description: "Blackbox has not been able to reach: {{ $labels.instance }} for over 2 min."